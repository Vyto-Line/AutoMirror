name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        run: |
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" src
      - name: Build APK
        working-directory: src
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          java -version
          gradle --version
          gradle assembleDebug --no-daemon
          mkdir -p ../out && cp app/build/outputs/apk/debug/*.apk ../out/AutoMirror.apk
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag -R "${{ github.repository }}" || true
          gh release create latest out/AutoMirror.apk -R "${{ github.repository }}" --title "AutoMirror APK" --notes "Automatic build"
permissions:
  contents: write
